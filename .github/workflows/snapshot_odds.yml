name: Snapshot Pinnacle odds

# Captures Pinnacle prices shortly before kickoff (Blueprint Section 28).
#
# Runs hourly. Each run only looks at fixtures kicking off in the next 30-100
# minutes and never re-captures a fixture already recorded, so the cost is one
# call for the fixture list plus one per new fixture — comfortably inside the
# confirmed 1800/hour limit.
#
# Hourly is a deliberate compromise. GitHub's scheduled runs are best-effort
# and can be delayed by several minutes under load, so a tighter window risks
# missing fixtures entirely. 30-100 minutes is wide enough to tolerate that
# while still capturing a price close to kickoff.
on:
  schedule:
    - cron: '5 * * * *'      # every hour, 5 past
  workflow_dispatch: {}       # manual trigger for testing

permissions:
  contents: write             # needed to commit the snapshot file back

concurrency:
  # Never let two snapshot runs overlap — both would read the same "already
  # seen" list, capture the same fixtures, and duplicate rows.
  group: odds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run snapshot
        env:
          FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS_KEY }}
        run: |
          if [ -z "$FOOTYSTATS_KEY" ]; then
            echo "FOOTYSTATS_KEY secret is not set — cannot run."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 snapshot_odds.py --no-sheets

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odds_snapshots.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new snapshots this run (normal outside the pre-kickoff window)."
          else
            # Pull with rebase first: the daily data-refresh workflow commits to
            # the same branch, and without this a concurrent commit makes the
            # push fail and the snapshot is lost.
            git pull --rebase --autostash origin main || true
            git commit -m "Odds snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
