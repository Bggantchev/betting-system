name: Refresh league data

# Runs automatically every day, early morning UTC. Checking daily (rather
# than guessing an exact twice-weekly cadence) means results from any
# matchday — weekend or midweek — get picked up within at most ~24 hours,
# regardless of exactly when football-data.co.uk itself updates. A daily
# check costs nothing if there's no new data (the fetch just re-downloads
# the same file and no commit happens — see the "if nothing changed" step
# below). Also runnable manually any time from the GitHub Actions tab.
on:
  schedule:
    - cron: '0 7 * * *'   # every day, 07:00 UTC (after last-night's matches)
  workflow_dispatch: {}     # lets you trigger it manually on demand

permissions:
  contents: write   # needed so the workflow can commit refreshed CSVs back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute current season code
        id: season
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          season_start = now.year if now.month >= 8 else now.year - 1
          code = f"{str(season_start)[-2:]}{str(season_start+1)[-2:]}"
          prev = f"{str(season_start-1)[-2:]}{str(season_start)[-2:]}"
          print(f"code={code}")
          print(f"prev={prev}")
          EOF

      - name: Download latest league CSVs
        run: |
          SEASON="${{ steps.season.outputs.code }}"
          echo "Using season code: $SEASON"
          mkdir -p data
          declare -A LEAGUES=(
            [E0]=E0_raw.csv
            [SP1]=SP1_raw.csv
            [I1]=I1_raw.csv
            [D1]=D1_raw.csv
            [F1]=F1_raw.csv
            [N1]=N1_raw.csv
            [P1]=P1_raw.csv
            [B1]=B1_raw.csv
          )
          mkdir -p /tmp/fsdl
          PREV="${{ steps.season.outputs.prev }}"
          echo "Current season: $SEASON   Fallback season: $PREV"
          echo ""

          # Returns 0 if $1 is a valid CSV for league code $2.
          # Three ways a download can be structurally plausible but wrong:
          #   - an HTML error page served with HTTP 200
          #   - a CSV for a different league (the source mismaps codes early
          #     in a season: on 2026-08-14 E0.csv served Championship data and
          #     SP1.csv served Primeira Liga)
          #   - too few lines to contain any matches
          validate_file() {
            local F="$1" CODE="$2"
            [ -f "$F" ] || return 1
            local LINES; LINES=$(wc -l < "$F")
            [ "$LINES" -ge 2 ] || return 1
            head -1 "$F" | grep -q "HomeTeam" || return 1
            local DIV; DIV=$(awk -F, 'NR==2 {gsub(/"/,"",$1); print $1}' "$F")
            [ "$DIV" = "$CODE" ] || return 1
            return 0
          }

          for CODE in "${!LEAGUES[@]}"; do
            FILE="${LEAGUES[$CODE]}"
            INSTALLED=0

            for TRY_SEASON in "$SEASON" "$PREV"; do
              URL="https://www.football-data.co.uk/mmz4281/${TRY_SEASON}/${CODE}.csv"
              TMP="/tmp/fsdl/${CODE}_${TRY_SEASON}.csv"

              if curl -sL --fail "$URL" -o "$TMP" 2>/dev/null; then
                if validate_file "$TMP" "$CODE"; then
                  mv "$TMP" "data/$FILE"
                  MATCHES=$(( $(wc -l < "data/$FILE") - 1 ))
                  if [ "$TRY_SEASON" = "$SEASON" ]; then
                    echo "  OK: $CODE season $TRY_SEASON ($MATCHES matches)"
                  else
                    echo "  OK: $CODE season $TRY_SEASON ($MATCHES matches) <- FALLBACK,"
                    echo "      current season $SEASON was unavailable or served the wrong league"
                  fi
                  INSTALLED=1
                  break
                else
                  DIV=$(awk -F, 'NR==2 {gsub(/"/,"",$1); print $1}' "$TMP" 2>/dev/null | cut -c1-20)
                  echo "  reject: $CODE season $TRY_SEASON (Div='$DIV')"
                fi
              else
                echo "  reject: $CODE season $TRY_SEASON (download failed)"
              fi
            done

            if [ "$INSTALLED" = "0" ]; then
              # Nothing valid was downloadable. Is what we already have usable?
              if validate_file "data/$FILE" "$CODE"; then
                echo "  KEEP: $CODE — no valid download, existing file is sound"
              else
                echo "  *** BROKEN: $CODE — no valid download AND existing file is invalid."
                echo "      data/$FILE holds wrong-league or non-CSV content and needs manual repair."
              fi
            fi
          done

          echo ""
          echo "Post-download check — size, checksum and league identity:"
          for CODE in "${!LEAGUES[@]}"; do
            FILE="${LEAGUES[$CODE]}"
            if [ -f "data/$FILE" ]; then
              DIV=$(awk -F, 'NR==2 {gsub(/"/,"",$1); print $1}' "data/$FILE")
              echo "  $FILE: $(wc -l < "data/$FILE") lines, md5 $(md5sum "data/$FILE" | cut -c1-8), Div=$DIV"
            fi
          done

          echo ""
          DUPES=$(md5sum data/*.csv 2>/dev/null | awk '{print $1}' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "WARNING: identical files detected — two leagues hold the same data:"
            for H in $DUPES; do
              md5sum data/*.csv | grep "^$H" | awk '{print "  " $2}'
            done
            echo "  This means the source served the same content for different league codes."
          else
            echo "No duplicate files — every league holds distinct data."
          fi

      - name: Validate downloaded data (Section 23.4)
        run: |
          python3 -m pip install --quiet pandas
          echo "Auditing freshly downloaded files for implausible odds..."
          python3 validate_data.py || true
        continue-on-error: true

      - name: Commit refreshed data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No changes — data already current."
          else
            git commit -m "Automated data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
